name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # -------- Linux build (Ubuntu LTS) --------
  linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (SDL2, OpenGL headers, libusb, xvfb, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config \
              libsdl2-dev libsdl2-ttf-dev \
              libgl1-mesa-dev libglu1-mesa libgl1-mesa-dri \
              libusb-1.0-0-dev \
              xvfb \
              fonts-dejavu-core

      - name: Show platform info
        run: make platform

      - name: Build
        run: make -j$(nproc)

      - name: Smoke test (--list)
        run: ./psu_app --list

      - name: Smoke test (launch under xvfb)
        run: |
          # ImGui now uses the OpenGL3 backend, which needs a real GL
          # context — SDL_VIDEODRIVER=dummy won't do. xvfb gives us a
          # virtual X server with Mesa software GL.
          xvfb-run -a -s "-screen 0 1280x720x24" \
              bash -c 'timeout 1 ./psu_app --driver=demo     --view=toolbar-single --port=- || [ $? -eq 124 ]'
          xvfb-run -a -s "-screen 0 1280x720x24" \
              bash -c 'timeout 1 ./psu_app --driver=demo     --view=full-dual      --port=- || [ $? -eq 124 ]'
          xvfb-run -a -s "-screen 0 1280x720x24" \
              bash -c 'timeout 1 ./psu_app --driver=dmm-demo --view=dmm-full       --port=- || [ $? -eq 124 ]'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-lab-bench-linux-x86_64
          path: |
            psu_app
            psu_probe

  # -------- Windows build (MSYS2 / MINGW64) --------
  windows:
    name: Windows (MinGW-w64 / MSYS2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_ttf

      - name: Show platform info
        run: make platform

      - name: Build
        run: make -j$(nproc)

      - name: Smoke test (--list)
        run: ./psu_app.exe --list

      - name: Collect SDL2 runtime DLLs (auto-discover via ldd)
        run: |
          mkdir -p dist
          cp psu_app.exe psu_probe.exe dist/
          # Walk every DLL ldd reports for both exes and copy anything that
          # lives under /mingw64. This guarantees the bundle has every
          # transitive dep regardless of how SDL2/SDL2_ttf are stitched
          # together in the current MSYS2 toolchain.
          set -eu
          collect() {
            local exe="$1"
            ldd "$exe" | awk '/=>/ {print $3}' | while read -r dll; do
              # ldd on MSYS2 emits Unix paths; system32 DLLs show as
              # /c/Windows/... and should NOT be copied.
              case "$dll" in
                /mingw64/*|/usr/*) cp -u "$dll" dist/ ;;
              esac
            done
          }
          collect psu_app.exe
          collect psu_probe.exe
          # Bundle a TTF font so the binary doesn't depend on the user
          # having Consolas / Courier New installed at C:\Windows\Fonts.
          # (pl_find_monospace_font also probes C:\Windows\Fonts on Win32.)
          if [ -f /mingw64/share/fonts/TTF/DejaVuSansMono.ttf ]; then
            cp /mingw64/share/fonts/TTF/DejaVuSansMono.ttf dist/
          fi
          echo "--- dist contents ---"
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-lab-bench-windows-x86_64
          path: dist/
